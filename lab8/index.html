<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Loja</title>
  </head>
  <body>
    <header>
      <h1>Loja Online</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div id="controlos">
        <label
          >Filtrar:
          <select id="filtro">
            <option value="">Todas as categorias</option>
          </select>
        </label>

        <label
          >Ordenar:
          <select id="ordenar">
            <option value="">Ordenar pelo preço</option>
            <option value="asc">Preço crescente</option>
            <option value="desc">Preço decrescente</option>
          </select>
        </label>

        <label
          >Procurar:
          <input type="text" id="pesquisa" placeholder="Pesquisar produto..." />
        </label>
      </div>

      <h2>Produtos</h2>
      <section id="produtos"></section>

      <h2>Cesto</h2>
      <section id="cesto"></section>

      <div id="checkout">
        <label>
          <input type="checkbox" id="estudante" />
          És estudante do DEISI?
        </label>

        <label
          >Cupão de desconto:
          <input type="text" id="cupao" placeholder="Insere o cupão" />
        </label>

        <button id="comprar">Comprar</button>

        <div id="resultado-compra"></div>
      </div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
    <script src="main.js"></script>
  </body>
</html>
