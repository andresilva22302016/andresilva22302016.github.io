<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercícios JavaScript</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="div-logo">
      <img id="logo-principal" src="logo.png" alt="Logótipo" />
    </div>

    <div id="principal">
      <div id="bloco-1">
        <p id="elem1">Passa aqui o rato</p>
      </div>
      <div id="bloco-2">
        <p>2. Pinta-me!</p>
        <button id="btnRed">Red</button>
        <button id="btnGreen">Green</button>
        <button id="btnBlue">Blue</button>
        <div id="alvoPintar">Área para pintar</div>
      </div>
      <div id="bloco-3">
        <label for="inputEscreve">3. Experimenta escrever...</label>
        <input type="text" id="inputEscreve" />
        <span id="outputEscreve"></span>
      </div>
      <div id="bloco-4">
        <label for="inputCor">4. Escolha uma cor em inglês:</label>
        <input type="text" id="inputCor" />
        <button id="btnSubmeterCor">submeter</button>
      </div>
      <div id="bloco-5">
        <button id="btnConta">Conta!</button>
        <span id="spanContador">0</span>
      </div>
      <div id="bloco-6">
        <p>6. Cores (querySelectorAll e dataset):</p>
        <button class="color" data-color="red">Red</button>
        <button class="color" data-color="green">Green</button>
        <button class="color" data-color="blue">Blue</button>
      </div>

      <div id="bloco-7">
        <label for="selectCorPage">7. Cor da página (Select e 'this'):</label>
        <select id="selectCorPage">
          <option value="#f4f4f9">White</option>
          <option value="tomato">Tomato</option>
          <option value="lightblue">Light Blue</option>
        </select>
      </div>
      <div id="bloco-8">
        <p>9. Formulário (onsubmit e preventDefault):</p>
        <form id="formNomeIdade">
          <input
            id="inputNome"
            type="text"
            placeholder="Insira o seu nome"
            required
          />
          <input
            id="inputIdade"
            type="number"
            placeholder="Insira a sua idade"
            required
          />
          <input type="submit" value="Submeter" />
        </form>
        <p id="outputForm"></p>
      </div>

      <div id="bloco-9">
        <p>10. Contador (Local Storage): <span id="spanContadorLS">0</span></p>
        <button id="btnInc">Incrementar</button>
        <button id="btnDec">Decrementar</button>
        <button id="btnReset">Reset</button>
      </div>

      <div id="bloco-10">
        <p>11. Temporizador: <span id="spanTimer">0</span></p>
      </div>
    </div>

    <script src="scripts/main.js"></script>
  </body>
</html>
